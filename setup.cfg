[flake8]

exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,

ignore = I201, E501, D100, D101, D102, D103, D107

per-file-ignores =
    src/app/layout.py: E501
    src/app/callbacks.py: E501

# Extiende las reglas seleccionadas para incluir varios plugins y convenciones:
# B,B9,C4,COM,ANN,D,ERA,LOG,SIM,N,IS son códigos de errores/advertencias adicionales
extend-select = B,B9,C4,COM,ANN,D,ERA,LOG,SIM,N,IS

# Convención de docstrings: Google (puede ser google, numpy, pep257)
docstring-convention = google

[isort]

profile =  black

# Longitud máxima de línea para imports
line_length = 78

# Define las secciones de imports y su orden
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY

# Indica qué paquetes son considerados "first party" (propios del proyecto)
known_first_party =

src_paths = src

# Paquetes de terceros conocidos
known_third_party = rapidfuzz, plotly

# Asegura una línea en blanco antes de comentarios
ensure_newline_before_comments = true

# Fuerza el orden dentro de secciones y por tipo (clases, funciones, etc.)
force_sort_within_sections = true
order_by_type = False
combine_as_imports = false

# Número de líneas en blanco entre secciones de imports
lines_between_sections = 1

# Separación entre import types dentro de la misma sección
lines_between_types = 0

# Encabezados opcionales para cada sección (solo decorativo)
import_heading_future = FUTURE
import_heading_stdlib = STDLIB
import_heading_thirdparty = THIRDPARTY
import_heading_firstparty = FIRSTPARTY
import_heading_localfolder = LOCALFOLDER

# Versión de Python para referencia (afecta orden en algunos casos)
py_version = 310
