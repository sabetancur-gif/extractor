
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b1120;
    font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.03em; }
  .sub { font-size: 13px; color: #475569; margin-top: 3px; font-family: Georgia, serif; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 12px; }
  .btn-root {
    padding: 8px 16px; border-radius: 9px; border: 2px solid;
    cursor: pointer; font-weight: 700; font-size: 12px;
    transition: all 0.2s; background: transparent;
  }
  .btn {
    padding: 8px 14px; border-radius: 9px; border: none;
    cursor: pointer; font-weight: 700; font-size: 12px;
    background: #1e293b; color: #94a3b8; transition: all 0.15s;
  }
  .btn:hover { background: #334155; color: #e2e8f0; }
  .spacer { flex: 1; }
  .speed-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .speed-row span { font-size: 11px; color: #475569; min-width: 36px; }
  input[type=range] { flex: 1; height: 4px; border-radius: 2px; cursor: pointer; }
  svg { display: block; border-radius: 14px; border: 1px solid #1e293b; background: #080e1a; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 14px; }
  .stat-label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .stat-val { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; }
  .legend { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #475569; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Método de Newton</h1>
  <div class="sub">f(x) = 2<sup>x</sup> &minus; 3x &minus; 4 &nbsp;|&nbsp; Convergencia animada</div>

  <div class="controls">
    <button class="btn-root" id="btn0" onclick="switchRoot(0)">Raíz negativa</button>
    <button class="btn-root" id="btn1" onclick="switchRoot(1)">Raíz positiva</button>
    <div class="spacer"></div>
    <button class="btn" id="btnPlay" onclick="togglePause()">⏸ Pausar</button>
    <button class="btn" onclick="resetAnim()">↺</button>
  </div>

  <div class="speed-row">
    <span>Lento</span>
    <input type="range" id="speedSlider" min="0" max="100" value="55" oninput="updateSpeed(this.value)">
    <span>Rápido</span>
  </div>

  <svg id="plot" viewBox="0 0 700 400" width="100%"></svg>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">x<sub>n</sub> actual</div>
      <div class="stat-val" id="statX" style="color:#94a3b8">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">f(x<sub>n</sub>)</div>
      <div class="stat-val" id="statFx" style="color:#94a3b8">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Error |x<sub>n</sub> &minus; raíz|</div>
      <div class="stat-val" id="statErr" style="color:#94a3b8">—</div>
    </div>
  </div>

  <div class="legend">
    <div class="leg-item"><svg width="26" height="12"><line x1="0" y1="6" x2="26" y2="6" stroke="#38bdf8" stroke-width="2.5"/></svg>f(x)</div>
    <div class="leg-item"><svg width="26" height="12"><line x1="0" y1="6" x2="26" y2="6" stroke="#a855f7" stroke-width="2"/></svg>Tangente</div>
    <div class="leg-item"><svg width="26" height="12"><line x1="0" y1="6" x2="26" y2="6" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,3"/></svg>Vertical</div>
    <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#34d399"/></svg>Raíces exactas</div>
  </div>
</div>

<script>
const W=700, H=400, PL=54, PR=28, PT=28, PB=48;
const XMN=-2.5, XMX=6.5, YMN=-11, YMX=22;

const f  = x => Math.pow(2,x) - 3*x - 4;
const df = x => Math.log(2)*Math.pow(2,x) - 3;
const sx = x => PL + ((x-XMN)/(XMX-XMN))*(W-PL-PR);
const sy = y => H-PB - ((y-YMN)/(YMX-YMN))*(H-PT-PB);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const CONFIGS = [
  { x0:-1,  target:-1.186920152081, color:'#818cf8', glow:'#a5b4fc', label:'Raíz negativa', sub:'x₁ ≈ −1.18692' },
  { x0:5,   target:4.0,             color:'#fb923c', glow:'#fdba74', label:'Raíz positiva',  sub:'x₂ = 4'       },
];
const MAX_ITER = 6;
const SUB = '₀₁₂₃₄₅₆';

let ri=0, step=0, paused=false, speed=850, timer=null;

function getIters(x0) {
  let arr=[x0], x=x0;
  for(let i=0;i<MAX_ITER;i++){ x = x - f(x)/df(x); arr.push(x); }
  return arr;
}

// Build curve path once
function buildCurve() {
  let d='', mv=true;
  for(let i=0;i<=600;i++){
    const x = XMN+(i/600)*(XMX-XMN);
    const y = f(x);
    if(y<YMN-3||y>YMX+3){mv=true;continue;}
    const py = sy(clamp(y,YMN-3,YMX+3));
    d += mv ? `M${sx(x).toFixed(1)},${py.toFixed(1)}` : ` L${sx(x).toFixed(1)},${py.toFixed(1)}`;
    mv=false;
  }
  return d;
}

function ns(tag, attrs={}, children=[]) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  for(const c of children) if(c) el.appendChild(c);
  return el;
}
function txt(x,y,content,attrs={}) {
  const el = ns('text', {x,y,...attrs});
  el.textContent = content;
  return el;
}

const svg = document.getElementById('plot');
const CURVE_D = buildCurve();

// Static layer
function buildStatic() {
  const g = ns('g', {id:'static'});

  // Grid
  for(const x of [-2,-1,1,2,3,4,5,6]) {
    g.appendChild(ns('line',{x1:sx(x),y1:PT,x2:sx(x),y2:H-PB,stroke:'#0f172a','stroke-width':1}));
    g.appendChild(ns('line',{x1:sx(x),y1:sy(0)-4,x2:sx(x),y2:sy(0)+4,stroke:'#1e293b','stroke-width':1.5}));
    g.appendChild(txt(sx(x),sy(0)+18,x,{'text-anchor':'middle','font-size':11,fill:'#1e293b'}));
  }
  for(const y of [-10,-5,5,10,15,20]) {
    g.appendChild(ns('line',{x1:PL,y1:sy(y),x2:W-PR,y2:sy(y),stroke:'#0f172a','stroke-width':1}));
    g.appendChild(ns('line',{x1:sx(0)-4,y1:sy(y),x2:sx(0)+4,y2:sy(y),stroke:'#1e293b','stroke-width':1.5}));
    g.appendChild(txt(sx(0)-10,sy(y)+4,y,{'text-anchor':'end','font-size':11,fill:'#1e293b'}));
  }
  // Origin label
  g.appendChild(txt(sx(0)-8,sy(0)+18,'0',{'text-anchor':'end','font-size':11,fill:'#1e293b'}));

  // Axes
  g.appendChild(ns('line',{x1:PL,y1:sy(0),x2:W-PR-8,y2:sy(0),stroke:'#1e293b','stroke-width':1.8}));
  g.appendChild(ns('line',{x1:sx(0),y1:H-PB,x2:sx(0),y2:PT+8,stroke:'#1e293b','stroke-width':1.8}));
  g.appendChild(ns('polygon',{points:`${W-PR},${sy(0)} ${W-PR-10},${sy(0)-4} ${W-PR-10},${sy(0)+4}`,fill:'#1e293b'}));
  g.appendChild(ns('polygon',{points:`${sx(0)},${PT} ${sx(0)-4},${PT+10} ${sx(0)+4},${PT+10}`,fill:'#1e293b'}));
  g.appendChild(txt(W-PR+3,sy(0)+5,'x',{fill:'#334155','font-size':13,'font-style':'italic'}));
  g.appendChild(txt(sx(0)+8,PT+5,'y',{fill:'#334155','font-size':13,'font-style':'italic'}));

  // Curve
  g.appendChild(ns('path',{d:CURVE_D,fill:'none',stroke:'#38bdf8','stroke-width':2.5}));
  g.appendChild(txt(sx(5.55),sy(f(5.55))-10,'f(x)',{fill:'#38bdf8','font-size':13,'font-style':'italic','font-weight':'bold'}));

  // Root markers
  for(const [rx,lbl] of [[-1.186920152,'x₁'],[4,'x₂']]) {
    g.appendChild(ns('line',{x1:sx(rx),y1:sy(0)-12,x2:sx(rx),y2:sy(0)+12,stroke:'#34d399','stroke-width':2.5}));
    g.appendChild(ns('circle',{cx:sx(rx),cy:sy(0),r:5,fill:'#34d399'}));
    g.appendChild(txt(sx(rx),sy(0)-19,lbl,{'text-anchor':'middle','font-size':11,fill:'#34d399','font-weight':'bold'}));
  }

  return g;
}

// Dynamic layer
let dynamicG = null;

function buildDynamic() {
  if(dynamicG) svg.removeChild(dynamicG);
  dynamicG = ns('g', {id:'dynamic'});

  const cfg   = CONFIGS[ri];
  const iters = getIters(cfg.x0);
  const vis   = Math.min(step, MAX_ITER);

  for(let i=0;i<vis;i++){
    const xi  = iters[i];
    const yi  = f(xi);
    const xn  = iters[i+1];
    const age = vis - 1 - i;
    const op  = Math.max(0.1, 1 - age*0.22).toFixed(2);
    const lw  = age===0 ? 2.3 : 1.5;

    const ax=sx(xi), ay=sy(0);
    const cx=sx(xi), cy=sy(yi);
    const nx=sx(xn), ny=sy(0);

    // Vertical dashed
    dynamicG.appendChild(ns('line',{x1:ax,y1:ay,x2:cx,y2:cy,
      stroke:cfg.color,'stroke-width':lw,'stroke-dasharray':'5,3',opacity:+op*0.7}));
    // Tangent
    dynamicG.appendChild(ns('line',{x1:cx,y1:cy,x2:nx,y2:ny,
      stroke:cfg.color,'stroke-width':age===0?2.6:lw,opacity:op}));
    // Dot on curve
    dynamicG.appendChild(ns('circle',{cx,cy,r:age===0?6.5:4,fill:cfg.color,opacity:op}));
    // Dot on axis (xn)
    dynamicG.appendChild(ns('circle',{cx:nx,cy:ny,r:age===0?4:3,
      fill:'#0b1120',stroke:cfg.color,'stroke-width':age===0?2.2:1.5,opacity:op}));
    // x-label
    if(age<=3){
      const lx = ax, ly = yi>=0 ? ay+20 : ay-12;
      dynamicG.appendChild(txt(lx,ly,`x${SUB[i]||i}`,
        {'text-anchor':'middle','font-size':12,fill:cfg.color,'font-style':'italic',opacity:op}));
    }
  }

  // Current x on axis (hollow circle)
  const curX = iters[vis];
  dynamicG.appendChild(ns('circle',{cx:sx(curX),cy:sy(0),r:6,
    fill:'#0b1120',stroke:cfg.color,'stroke-width':2.5}));

  // Badge
  const bx = W-PR-142, by = PT+2;
  dynamicG.appendChild(ns('rect',{x:bx,y:by,width:137,height:26,rx:7,
    fill:cfg.color+'22',stroke:cfg.color+'55'}));
  const badge = txt(bx+68, by+17, `Iteración ${vis} / ${MAX_ITER}`,
    {'text-anchor':'middle','font-size':12,'font-weight':'bold',fill:cfg.color});
  dynamicG.appendChild(badge);

  svg.appendChild(dynamicG);

  // Update stats
  const fx  = f(curX);
  const err = Math.abs(curX - cfg.target);
  document.getElementById('statX').textContent  = curX.toFixed(10);
  document.getElementById('statX').style.color  = cfg.color;
  document.getElementById('statFx').textContent = Math.abs(fx)<1e-13 ? '≈ 0' : fx.toExponential(4);
  document.getElementById('statErr').textContent = err<1e-13 ? '< 10⁻¹³' : err.toExponential(4);
}

function tick() {
  clearTimeout(timer);
  if(paused) return;
  const delay = step >= MAX_ITER ? 1800 : speed;
  const next  = step >= MAX_ITER ? 0 : step + 1;
  timer = setTimeout(() => { step = next; buildDynamic(); tick(); }, delay);
}

function switchRoot(idx) {
  ri = idx; step = 0;
  document.getElementById('btn0').style.background = idx===0 ? CONFIGS[0].color : 'transparent';
  document.getElementById('btn0').style.color = idx===0 ? '#0b1120' : CONFIGS[0].color;
  document.getElementById('btn0').style.borderColor = CONFIGS[0].color;
  document.getElementById('btn1').style.background = idx===1 ? CONFIGS[1].color : 'transparent';
  document.getElementById('btn1').style.color = idx===1 ? '#0b1120' : CONFIGS[1].color;
  document.getElementById('btn1').style.borderColor = CONFIGS[1].color;
  // Update slider accent
  document.getElementById('speedSlider').style.accentColor = CONFIGS[idx].color;
  buildDynamic(); tick();
}

function togglePause() {
  paused = !paused;
  document.getElementById('btnPlay').textContent = paused ? '▶ Continuar' : '⏸ Pausar';
  if(!paused) tick();
}

function resetAnim() { step = 0; buildDynamic(); if(!paused) tick(); }

function updateSpeed(v) {
  // slider 0→100 maps to speed 1600→200
  speed = 1700 - v*15;
}

// Init
svg.appendChild(buildStatic());
switchRoot(0);
</script>
</body>
</html>
